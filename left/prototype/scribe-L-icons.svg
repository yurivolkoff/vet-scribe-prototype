<?xml version="1.0" encoding="utf-8"?>
<!-- Prototype L: icons that Peter's live markup takes from /i/frontend/employee/svg/icons.svg but our 2026-11-05 copy
     of that sprite does not have (mic, mic-off, player-*). Redrawn in the Vet.AF sprite style (32×32, stroke, round caps);
     in the product Peter's own symbols are used — only the ids matter. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg">

    <symbol id="mic" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.25)" stroke-linecap="round" stroke-linejoin="round">
            <rect x="12.5" y="5.5" width="7" height="13" rx="3.5"/>
            <path d="M9 15.5c0 3.9 3.1 7 7 7s7-3.1 7-7"/>
            <path d="M16 22.5v4"/>
            <path d="M12.5 26.5h7"/>
        </g>
    </symbol>

    <symbol id="mic-off" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.25)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.5 14V9a3.5 3.5 0 0 0-6.6-1.6"/>
            <path d="M12.5 12.5v3a3.5 3.5 0 0 0 5.6 2.8"/>
            <path d="M9 15.5c0 3.9 3.1 7 7 7 1.6 0 3-.5 4.2-1.4"/>
            <path d="M23 15.5c0 .9-.2 1.8-.5 2.6"/>
            <path d="M16 22.5v4"/>
            <path d="M12.5 26.5h7"/>
            <path d="M7 7l18 18"/>
        </g>
    </symbol>

    <symbol id="player-record" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="5.5" fill="currentColor"/>
    </symbol>

    <symbol id="player-pause" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.5)" stroke-linecap="round">
            <path d="M12.5 10v12"/>
            <path d="M19.5 10v12"/>
        </g>
    </symbol>

    <symbol id="player-play" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.25)" stroke-linejoin="round">
            <path d="M12 9.5v13l10.5-6.5z"/>
        </g>
    </symbol>

    <symbol id="player-send" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.25)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 20V8"/>
            <path d="M11 13l5-5l5 5"/>
            <path d="M8 19.5v4.5h16v-4.5"/>
        </g>
    </symbol>

    <symbol id="player-close" viewBox="0 0 32 32">
        <g fill="none" stroke="currentColor" stroke-width="var(--width, 1.25)" stroke-linecap="round">
            <path d="M10.5 10.5l11 11"/>
            <path d="M21.5 10.5l-11 11"/>
        </g>
    </symbol>

</svg>
